<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/produtos.css">
</head>
<body>
    <header class="site-header">
        <h1>Produtos</h1>
    </header>

    <main class="container">
        <section class="produtos">
            <article class="produto">
                <h2 class="nome">Boné</h2>
                <p class="preco">R$ 4.000,00</p>
                <img src="assets/bone.jpg" alt="Boné">
                
                <button type="button" class="btn">Comprar</button>
            </article>

            <article class="produto">
                <h2 class="nome">Skate</h2>
                <p class="preco">R$ 4.000,00</p>
                <img src="assets/skate.jpg" alt="Skate">
                <button type="button" class="btn">Comprar</button>
            </article>

            <article class="produto">
                <h2 class="nome">Tênis</h2>
                <p class="preco">R$ 4.000,00</p>
                <img src="assets/tenis_nike.png" alt="Tênis Nike">
                <button type="button" class="btn">Comprar</button>
            </article>
        </section>
    </main>
</body>
</html>
